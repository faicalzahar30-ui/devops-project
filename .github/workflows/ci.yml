# name of the pipeline
name: tests

# run on every push and every pull request
on:
  push:
  pull_request:

# what it does
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # step 1: copy the code onto the machine
      - uses: actions/checkout@v4

      # step 2: test 1 - the file must exist
      - name: notes.txt must exist
        run: test -f notes.txt

      # step 3: test 2 - it must contain the expected text
      - name: check content of notes.txt
        run: grep -q "test file for git" notes.txt

      # step 4: test 3 - scripts must have valid syntax
      - name: syntax check scripts
        run: bash -n *.sh 2>/dev/null || echo "no .sh files, skipping"
